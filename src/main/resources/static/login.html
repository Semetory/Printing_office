<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в панель управления</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }
        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            margin-bottom: 25px;
            text-align: center;
            color: #2c3e50;
        }
        .error-msg {
            color: #e74c3c;
            background: #fdf2f2;
            padding: 10px;
            border-radius: 6px;
            display: none;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <div class="container header-container">
        <a href="index.html" class="logo">Типография</a>
        <button onclick="logout()" class="submit-btn" style="background:#7f8c8d; padding: 5px 15px;">Выйти</button>
    </div>
</header>

<main class="container login-container">
    <div class="login-card">
        <h2>Авторизация</h2>
        <div id="errorBox" class="error-msg"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="submit-btn" style="width: 100%; margin-top: 10px;">Войти</button>
        </form>
    </div>
</main>

<script src="/js/login.js"></script>
</body>
</html>
